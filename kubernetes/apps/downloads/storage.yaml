---
apiVersion: v1
items:
  - apiVersion: v1
    kind: PersistentVolume
    metadata:
      name: media
    spec:
      accessModes:
        - ReadWriteMany
      capacity:
        storage: 1Gi
      csi:
        driver: smb.csi.k8s.io
        nodeStageSecretRef:
          name: smb-credentials
          namespace: downloads
        volumeAttributes:
          source: //192.168.10.31/media
        volumeHandle: smb-share
      persistentVolumeReclaimPolicy: Retain
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: downloads-media
      namespace: downloads
    spec:
      accessModes:
        - ReadWriteMany
      resources:
        requests:
          storage: 1Gi
      storageClassName: ""
      volumeName: media
kind: List
