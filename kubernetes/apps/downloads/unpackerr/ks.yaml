---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: unpackerr
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: unpackerr
  interval: 30m
  path: ./kubernetes/apps/downloads/unpackerr/app
  prune: true
  retryInterval: 1m
  sourceRef:
    name: flux-system
    kind: GitRepository
  targetNamespace: downloads
  timeout: 5m
  wait: false
