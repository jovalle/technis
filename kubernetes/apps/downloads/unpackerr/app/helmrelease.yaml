---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unpackerr
spec:
  chart:
    spec:
      chart: app-template
      sourceRef:
        name: bjw-s
        kind: HelmRepository
        namespace: flux-system
      version: 3.7.3
  install:
    remediation:
      retries: 3
  interval: 30m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    controllers:
      unpackerr:
        containers:
          app:
            env:
              TZ: America/New_York
              UN_DEBUG: false
              UN_DIR_MODE: 755
              UN_FILE_MODE: 644
              UN_FOLDER_0_DELETE_AFTER: 10m
              UN_FOLDER_0_DELETE_FILES: false
              UN_FOLDER_0_DELETE_ORIGINAL: false
              UN_FOLDER_0_EXTRACT_PATH: /downloads
              UN_FOLDER_0_MOVE_BACK: false
              UN_FOLDER_0_PATH: /downloads
              UN_INTERVAL: 5m
              UN_MAX_RETRIES: 3
              UN_PARALLEL: 1
              UN_RETRY_DELAY: 5m
              UN_START_DELAY: 1m
              UN_WEBSERVER_METRICS: true
            image:
              repository: golift/unpackerr
              tag: 0.14.5@sha256:8493ffc2dd17e0b8a034552bb52d44e003fa457ee407da97ccc69328bce4a815
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
            resources:
              limits:
                memory: 1Gi
              requests:
                cpu: 20m
                memory: 256Mi
    persistence:
      config:
        type: emptyDir
      downloads:
        path: /mnt/hulkpool/downloads
        server: nexus.techn.is
        type: nfs
    service:
      app:
        controller: unpackerr
        ports:
          http:
            port: 5656
