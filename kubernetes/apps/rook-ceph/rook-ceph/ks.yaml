---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app rook-ceph
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 30m
  path: ./kubernetes/apps/rook-ceph/rook-ceph/app
  prune: false
  retryInterval: 1m
  sourceRef:
    name: flux-system
    kind: GitRepository
  targetNamespace: rook-ceph
  timeout: 5m
  wait: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app rook-ceph-cluster
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 30m
  path: ./kubernetes/apps/rook-ceph/rook-ceph/cluster
  prune: false
  retryInterval: 1m
  sourceRef:
    name: flux-system
    kind: GitRepository
  targetNamespace: rook-ceph
  timeout: 5m
  wait: false
