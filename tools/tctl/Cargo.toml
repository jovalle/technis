[package]
name = "tctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Technis Docker fleet terminal console"
license = "MIT"

[dependencies]
anyhow = "1"
bollard = { version = "0.21.1", default-features = false, features = ["pipe"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["full"] }
toml = "0.9"
