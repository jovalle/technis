<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="172" viewBox="460 180 1010 172" role="img" aria-labelledby="l-title">
  <title id="l-title">TECHNIS wordmark</title>
  <defs>
    <linearGradient id="l-face" x1="0" y1="0" x2=".85" y2="1">
      <stop stop-color="#a5ffff"/>
      <stop offset=".2" stop-color="#28eff8"/>
      <stop offset=".57" stop-color="#00d6e9"/>
      <stop offset="1" stop-color="#0094c7"/>
    </linearGradient>
    <linearGradient id="l-vertical" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#4efbff"/>
      <stop offset=".38" stop-color="#00d9e9"/>
      <stop offset="1" stop-color="#008cbe"/>
    </linearGradient>
    <linearGradient id="l-dark" x1="0" y1="0" x2=".7" y2="1">
      <stop stop-color="#15d9ed"/>
      <stop offset=".5" stop-color="#008cb0"/>
      <stop offset="1" stop-color="#004d85"/>
    </linearGradient>
    <linearGradient id="l-letter-edge" x1="0" y1="0" x2=".7" y2="1">
      <stop stop-color="#edffff"/>
      <stop offset=".45" stop-color="#96ffff"/>
      <stop offset="1" stop-color="#16dcf7"/>
    </linearGradient>
    <filter id="l-letter-glow" x="-15%" y="-50%" width="130%" height="200%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="2" seed="4" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grain"/>
      <feComposite in="grain" in2="SourceGraphic" operator="arithmetic" k1=".08" k2="0" k3=".96" k4="0" result="metal"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feComponentTransfer in="blur" result="bloom"><feFuncA type="linear" slope=".7"/></feComponentTransfer>
      <feMerge><feMergeNode in="bloom"/><feMergeNode in="metal"/></feMerge>
    </filter>
    <g id="l-post">
      <path d="M0 0H30V119H0Z" fill="url(#l-vertical)"/>
      <path d="M16 15L30 0V119L16 104Z" fill="url(#l-dark)" opacity=".52"/>
      <path d="M0 0H30L16 15Z" fill="#b3ffff"/>
      <path d="M0 119L16 104L30 119Z" fill="#35e3f5"/>
      <path d="M0 0H30V119H0Z" fill="none" stroke="url(#l-letter-edge)" stroke-width="1.1"/>
      <path d="M16 15V104" fill="none" stroke="#47eafa" stroke-width=".6"/>
    </g>
  </defs>
  <g filter="url(#l-letter-glow)" stroke-linejoin="round">
    <!-- T -->
    <path d="M532 227H570V318L552 332L532 318Z" fill="url(#l-vertical)"/>
    <path d="M552 227L570 241V318L552 332Z" fill="url(#l-dark)"/>
    <path d="M532 227H570V241L552 227L532 243Z" fill="#047b9d"/>
    <path d="M532 227V318L552 332L570 318V227M552 227V332" fill="none" stroke="url(#l-letter-edge)" stroke-width="1.1"/>
    <path d="M481 201H624L607 227H499Z" fill="url(#l-face)" stroke="url(#l-letter-edge)" stroke-width="1.4"/>

    <!-- E -->
    <g fill="url(#l-face)" stroke="url(#l-letter-edge)" stroke-width="1.2">
      <path d="M664 199H770L752 225H647Z"/>
      <path d="M648 247H759V271H648Z"/>
      <path d="M648 294H752L771 318H648Z"/>
    </g>
    <path d="M648 247H668L648 268ZM759 247L746 259L759 271ZM648 294H669L648 315Z" fill="#a1ffff" opacity=".32"/>

    <!-- C -->
    <path d="M822 199H922L904 225H836L827 234V284L836 293H904L922 318H822L800 295V225Z" fill="url(#l-face)"/>
    <path d="M822 199L836 225L827 234L800 225ZM800 295L827 284L836 293L822 318Z" fill="#56eff8" opacity=".68"/>
    <path d="M800 225L827 234V284L800 295Z" fill="url(#l-vertical)"/>
    <path d="M822 199H922L904 225H836L827 234V284L836 293H904L922 318H822L800 295V225Z" fill="none" stroke="url(#l-letter-edge)" stroke-width="1.4"/>

    <!-- H -->
    <use href="#l-post" x="950" y="199"/>
    <use href="#l-post" x="1043" y="199"/>
    <path d="M980 246H1043L1058 260L1043 273H980L966 260Z" fill="url(#l-face)"/>
    <path d="M966 260H1058L1043 273H980Z" fill="#04cce5"/>
    <path d="M980 246H1043M980 273H1043" fill="none" stroke="#b0ffff" stroke-width="1"/>

    <!-- N -->
    <use href="#l-post" x="1102" y="199"/>
    <use href="#l-post" x="1202" y="199"/>
    <path d="M1102 199H1131L1232 318H1203Z" fill="url(#l-face)" stroke="url(#l-letter-edge)" stroke-width="1.1"/>

    <!-- I -->
    <use href="#l-post" transform="translate(1265 198) scale(1.067 1.0084)"/>

    <!-- S -->
    <path d="M1346 197H1445L1426 221H1361L1352 230V237L1360 245H1426L1448 270V294L1426 318H1322L1340 293H1414L1422 285V278L1414 269H1345L1324 247V222Z" fill="url(#l-face)"/>
    <path d="M1346 197L1361 221L1352 230V237L1324 247V222Z" fill="#58f1fa" opacity=".45"/>
    <path d="M1324 247L1352 237L1360 245L1345 269Z" fill="#00b4d8"/>
    <path d="M1426 245L1448 270L1422 278L1414 269Z" fill="#21daf1"/>
    <path d="M1448 270V294L1422 285V278Z" fill="url(#l-dark)"/>
    <path d="M1422 285L1448 294L1426 318L1414 293Z" fill="url(#l-dark)"/>
    <path d="M1346 197H1445L1426 221H1361L1352 230V237L1360 245H1426L1448 270V294L1426 318H1322L1340 293H1414L1422 285V278L1414 269H1345L1324 247V222Z" fill="none" stroke="url(#l-letter-edge)" stroke-width="1.3"/>
  </g>
</svg>
