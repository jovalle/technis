name: komodo

services:
  mongo:
    image: mongo:8.0@sha256:479e85ced54ffb8a40dade1dcde2da2a9ae858515b9415e9cc54bfb8f0575d01
    environment:
      MONGO_INITDB_ROOT_USERNAME: komodo
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/technis/komodo/database
    restart: unless-stopped
    volumes:
      - mongo:/data/db
      - /run/technis/komodo/database:/run/technis/komodo/database:ro

  core:
    image: ghcr.io/moghtech/komodo-core:2.3.4@sha256:91b2afd7b3bb2abea0ebd3046d65ec457eb1f3d505868d1d60cb0f8562490ef9
    init: true
    depends_on:
      - mongo
    environment:
      KOMODO_DATABASE_ADDRESS: mongo:27017
      KOMODO_DATABASE_USERNAME: komodo
      KOMODO_DATABASE_PASSWORD_FILE: /run/technis/komodo/database
      KOMODO_DISABLE_INIT_RESOURCES: "true"
      KOMODO_DISABLE_USER_REGISTRATION: "true"
      KOMODO_FIRST_SERVER_NAME: nexus
      KOMODO_HOST: http://127.0.0.1:9120
      KOMODO_INIT_ADMIN_USERNAME: operator
      KOMODO_INIT_ADMIN_PASSWORD_FILE: /run/technis/komodo/admin
      KOMODO_JWT_SECRET_FILE: /run/technis/komodo/jwt
      KOMODO_LOCAL_AUTH: "true"
      KOMODO_PERIPHERY_PUBLIC_KEY: file:/config/keys/periphery.pub
    ports:
      - "127.0.0.1:9120:9120"
    restart: unless-stopped
    volumes:
      - /run/technis/komodo/admin:/run/technis/komodo/admin:ro
      - /run/technis/komodo/database:/run/technis/komodo/database:ro
      - /run/technis/komodo/jwt:/run/technis/komodo/jwt:ro
      - /run/technis/komodo/keys:/config/keys

  periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.3.4@sha256:fb4b52961fcce7a31e3776930e422967b6640f653de876f59f26dea243e29beb
    init: true
    depends_on:
      - core
    environment:
      PERIPHERY_CONNECT_AS: nexus
      PERIPHERY_CORE_ADDRESS: ws://core:9120
      PERIPHERY_CORE_PUBLIC_KEYS: file:/config/keys/core.pub
      PERIPHERY_DISABLE_CONTAINER_TERMINALS: "true"
      PERIPHERY_DISABLE_TERMINALS: "true"
    restart: unless-stopped
    volumes:
      - /run/technis/komodo/keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/technis/releases/stack:/var/lib/technis/releases/stack:ro

volumes:
  mongo:
