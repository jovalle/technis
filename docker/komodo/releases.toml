[[target]]
host = "nexus"
service = "flaresolverr"
architecture = "amd64"
repository = "ghcr.io/flaresolverr/flaresolverr"
tags = 'v3\.[0-9]+\.[0-9]+'
empty_mount = "/config"

[target.environment]
CAPTCHA_SOLVER = "none"
LOG_HTML = "false"
LOG_LEVEL = "info"
TZ = "America/New_York"

[target.probe]
container = "prowlarr"
port = 8191
health = "/health"

[[target.probe.startup]]
path = "/v1"
data = { cmd = "sessions.create", session = "{id}" }
expect = { status = "ok", session = "{id}" }

[[target.probe.startup]]
path = "/v1"
data = { cmd = "sessions.destroy", session = "{id}" }
expect = { status = "ok" }

[[target]]
host = "nexus"
service = "redis-exporter"
source_service = "redis"
architecture = "amd64"
repository = "docker.io/oliver006/redis_exporter"
tags = 'v1\.[0-9]+\.[0-9]+'
image_user = "59000:59000"
depends_on = ["redis"]
read_only = true

[target.labels]
"observability.metrics.address" = "redis-exporter:9121"
"traefik.enable" = "false"

[target.environment]
REDIS_ADDR = "redis://redis:6379"

[target.probe]
container = "prowlarr"
port = 9121
health = "/metrics"
contains = "redis_up 1"

[[target]]
host = "nexus"
service = "atuin"
architecture = "amd64"
repository = "ghcr.io/atuinsh/atuin"
tags = '18\.[0-9]+\.[0-9]+'
read_only = true
sqlite_db = "/config/atuin.db"

[target.environment]
ATUIN_CONFIG_DIR = "/config"
ATUIN_DB_URI = "sqlite:///config/atuin.db"
ATUIN_HOST = "0.0.0.0"
ATUIN_OPEN_REGISTRATION = "false"
ATUIN_PORT = "8888"
RUST_LOG = "atuin_server=info"
TZ = "America/New_York"

[target.labels]
"traefik.http.routers.atuin.rule" = 'Host(`atuin.techn.is`)'
"traefik.http.routers.atuin.service" = "atuin"
"traefik.http.services.atuin.loadbalancer.server.port" = "8888"

[target.probe]
container = "prowlarr"
port = 8888
health = "/healthz"

[[target]]
host = "nexus"
service = "vmalert-metrics"
architecture = "amd64"
repository = "docker.io/victoriametrics/vmalert"
tags = 'v1\.[0-9]+\.[0-9]+'
source_directory = "victoriametrics/alert"
environment = {}
read_only = true
depends_on = ["alertmanager"]
config_mount = "/etc/vmalert/rules"
config_files = ["logs.yaml", "metrics.yaml"]
config_check = ["-dryRun", "-rule=/etc/vmalert/rules/metrics.yaml"]
service_command = [
  "-datasource.url=http://victoriametrics:8428",
  "-remoteWrite.url=http://victoriametrics:8428",
  "-remoteRead.url=http://victoriametrics:8428",
  "-notifier.url=http://alertmanager:9093",
  "-rule=/etc/vmalert/rules/metrics.yaml",
  "-evaluationInterval=30s",
  "-httpListenAddr=:8880",
]

[target.labels]
"observability.metrics.address" = "vmalert-metrics:8880"
"traefik.enable" = "false"

[target.probe]
container = "prowlarr"
port = 8880
health = "/api/v1/rules"
alert_rules = true

[[target]]
host = "nexus"
service = "vmalert-logs"
architecture = "amd64"
repository = "docker.io/victoriametrics/vmalert"
tags = 'v1\.[0-9]+\.[0-9]+'
source_directory = "victoriametrics/alert"
environment = {}
read_only = true
depends_on = ["alertmanager", "victorialogs", "victoriametrics"]
config_mount = "/etc/vmalert/rules"
config_files = ["logs.yaml", "metrics.yaml"]
config_check = ["-dryRun", "-rule=/etc/vmalert/rules/logs.yaml", "-rule.defaultRuleType=vlogs"]
observation_seconds = 360
promote_after = "vmalert-metrics"
service_command = [
  "-datasource.url=http://victorialogs:9428",
  "-remoteWrite.url=http://victoriametrics:8428",
  "-remoteRead.url=http://victoriametrics:8428",
  "-notifier.url=http://alertmanager:9093",
  "-rule=/etc/vmalert/rules/logs.yaml",
  "-rule.defaultRuleType=vlogs",
  "-rule.evalDelay=5s",
  "-evaluationInterval=5m",
  "-httpListenAddr=:8880",
]

[target.labels]
"observability.metrics.address" = "vmalert-logs:8880"
"traefik.enable" = "false"

[target.probe]
container = "prowlarr"
port = 8880
health = "/api/v1/rules"
alert_rules = true
