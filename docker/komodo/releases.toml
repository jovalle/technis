[[target]]
host = "nexus"
service = "flaresolverr"
architecture = "amd64"
repository = "ghcr.io/flaresolverr/flaresolverr"
tags = 'v3\.[0-9]+\.[0-9]+'
empty_mount = "/config"

[target.environment]
CAPTCHA_SOLVER = "none"
LOG_HTML = "false"
LOG_LEVEL = "info"
TZ = "America/New_York"

[target.probe]
container = "prowlarr"
port = 8191
health = "/health"

[[target.probe.startup]]
path = "/v1"
data = { cmd = "sessions.create", session = "{id}" }
expect = { status = "ok", session = "{id}" }

[[target.probe.startup]]
path = "/v1"
data = { cmd = "sessions.destroy", session = "{id}" }
expect = { status = "ok" }

[[target]]
host = "nexus"
service = "redis-exporter"
source_service = "redis"
architecture = "amd64"
repository = "docker.io/oliver006/redis_exporter"
tags = 'v1\.[0-9]+\.[0-9]+'
image_user = "59000:59000"
depends_on = ["redis"]
read_only = true

[target.labels]
"observability.metrics.address" = "redis-exporter:9121"
"traefik.enable" = "false"

[target.environment]
REDIS_ADDR = "redis://redis:6379"

[target.probe]
container = "prowlarr"
port = 9121
health = "/metrics"
contains = "redis_up 1"

[[target]]
host = "nexus"
service = "atuin"
architecture = "amd64"
repository = "ghcr.io/atuinsh/atuin"
tags = '18\.[0-9]+\.[0-9]+'
read_only = true
sqlite_db = "/config/atuin.db"

[target.environment]
ATUIN_CONFIG_DIR = "/config"
ATUIN_DB_URI = "sqlite:///config/atuin.db"
ATUIN_HOST = "0.0.0.0"
ATUIN_OPEN_REGISTRATION = "false"
ATUIN_PORT = "8888"
RUST_LOG = "atuin_server=info"
TZ = "America/New_York"

[target.labels]
"traefik.http.routers.atuin.rule" = 'Host(`atuin.techn.is`)'
"traefik.http.routers.atuin.service" = "atuin"
"traefik.http.services.atuin.loadbalancer.server.port" = "8888"

[target.probe]
container = "prowlarr"
port = 8888
health = "/healthz"
