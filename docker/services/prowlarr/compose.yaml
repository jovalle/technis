services:
  prowlarr:
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    container_name: prowlarr
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 256M
        reservations:
          cpus: 0.1
          memory: 64M
    environment:
      - PGID=${PGID:-1000}
      - PROWLARR__SERVER__URLBASE=/indexers
      - PUID=${PUID:-1000}
      - TZ=${TZ:-America/New_York}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 1m0s
      test:
        - CMD-SHELL
        - curl -f http://127.0.0.1:9696/indexers/ping || exit 1
      timeout: 10s
    hostname: prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    labels:
      - gatus.group=acquisition
      - gatus.priority=P3
      - traefik.http.routers.prowlarr.middlewares=auth@file
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/prowlarr:/config
      - /mnt/media/downloads:/downloads
