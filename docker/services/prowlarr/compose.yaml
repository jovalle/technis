services:
  prowlarr:
    cap_drop:
      - ALL
    container_name: prowlarr
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 256M
        reservations:
          cpus: 0.1
          memory: 64M
    environment:
      - PROWLARR__SERVER__URLBASE=/indexers
      - TZ=${TZ:-America/New_York}
      - UMASK=002
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 1m0s
      test:
        - CMD-SHELL
        - curl -f http://127.0.0.1:9696/indexers/ping || exit 1
      timeout: 10s
    hostname: prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    labels:
      - traefik.http.routers.prowlarr.middlewares=auth@file
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # LinuxServer non-root mode: s6 needs a /run it owns, with exec.
    tmpfs:
      - /run:rw,nosuid,size=16m,uid=568,gid=568,exec
      - /tmp:rw,noexec,nosuid,size=64m,uid=568,gid=568
    user: 568:568
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/prowlarr:/config
