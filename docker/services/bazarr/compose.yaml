services:
  bazarr:
    cap_drop:
      - ALL
    container_name: bazarr
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 512M
        reservations:
          cpus: 0.25
          memory: 128M
    environment:
      - TZ=${TZ:-America/New_York}
      - UMASK=002
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 1m0s
      test:
        - CMD-SHELL
        - curl -fsS -o /dev/null http://127.0.0.1:6767/ || exit 1
      timeout: 10s
    hostname: bazarr
    image: lscr.io/linuxserver/bazarr:latest
    labels:
      - traefik.http.routers.bazarr.middlewares=auth@file
      - traefik.http.services.bazarr.loadbalancer.server.port=6767
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run:rw,nosuid,size=16m,uid=568,gid=568,exec
      - /tmp:rw,noexec,nosuid,size=64m,uid=568,gid=568
    user: 568:568
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/bazarr:/config
      - /mnt/media/movies:/movies
      - /mnt/media/series:/series
