services:
  victoriametrics:
    cap_drop:
      - ALL
    command:
      - -httpListenAddr=:8428
      - -retentionPeriod=13M
      - -selfScrapeInterval=30s
      - -storage.minFreeDiskSpaceBytes=20GB
      - -storageDataPath=/storage
      - -vmalert.proxyURL=http://vmalert-metrics:8880
    container_name: victoriametrics
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 2G
        reservations:
          cpus: 0.25
          memory: 256M
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8428/health]
      timeout: 10s
    hostname: victoriametrics
    image: victoriametrics/victoria-metrics:v1.151.0@sha256:6d164540a04f49ba4e696cbdb70f9fee78be1e94b8f2a1292743a0b1ab8275bd
    labels:
      - observability.metrics.address=victoriametrics:8428
      - traefik.enable=false
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/victoriametrics/data:/storage
