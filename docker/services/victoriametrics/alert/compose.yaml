services:
  vmalert-metrics:
    cap_drop:
      - ALL
    command:
      - -datasource.url=http://victoriametrics:8428
      - -remoteWrite.url=http://victoriametrics:8428
      - -remoteRead.url=http://victoriametrics:8428
      - -notifier.url=http://alertmanager:9093
      - -rule=/etc/vmalert/rules/metrics.yaml
      - -evaluationInterval=30s
      - -httpListenAddr=:8880
    container_name: vmalert-metrics
    depends_on:
      alertmanager:
        condition: service_healthy
        required: true
    healthcheck: &healthcheck
      interval: 30s
      retries: 3
      start_period: 15s
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8880/health]
      timeout: 10s
    hostname: vmalert-metrics
    image: docker.io/victoriametrics/vmalert:v1.157.0@sha256:c550cfc345a1f3e130a3c78b3f5a910122448c66b3008d9a29eaa0559e9a23dd
    labels:
      - observability.metrics.address=vmalert-metrics:8880
      - traefik.enable=false
    read_only: true
    restart: unless-stopped
    security_opt: &security_opt
      - no-new-privileges:true
    user: &user 568:568
    volumes:
      - type: bind
        source: ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/victoriametrics/alert/rules
        target: /etc/vmalert/rules
        read_only: true
        bind:
          create_host_path: false
  vmalert-logs:
    cap_drop:
      - ALL
    command:
      - -datasource.url=http://victorialogs:9428
      - -remoteWrite.url=http://victoriametrics:8428
      - -remoteRead.url=http://victoriametrics:8428
      - -notifier.url=http://alertmanager:9093
      - -rule=/etc/vmalert/rules/logs.yaml
      - -rule.defaultRuleType=vlogs
      - -rule.evalDelay=5s
      - -evaluationInterval=5m
      - -httpListenAddr=:8880
    container_name: vmalert-logs
    depends_on:
      alertmanager:
        condition: service_healthy
        required: true
      victorialogs:
        condition: service_healthy
        required: true
      victoriametrics:
        condition: service_healthy
        required: true
    healthcheck: *healthcheck
    hostname: vmalert-logs
    image: docker.io/victoriametrics/vmalert:v1.157.0@sha256:c550cfc345a1f3e130a3c78b3f5a910122448c66b3008d9a29eaa0559e9a23dd
    labels:
      - observability.metrics.address=vmalert-logs:8880
      - traefik.enable=false
    read_only: true
    restart: unless-stopped
    security_opt: *security_opt
    user: *user
    volumes:
      - type: bind
        source: ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/victoriametrics/alert/rules
        target: /etc/vmalert/rules
        read_only: true
        bind:
          create_host_path: false
