services:
  boxarr:
    cap_drop:
      - ALL
    container_name: boxarr
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 256M
        reservations:
          cpus: 0.1
          memory: 64M
    environment:
      - BOXARR_URL_BASE=discover
      - TZ=${TZ:-America/New_York}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
        - CMD-SHELL
        - curl -f http://127.0.0.1:8888/discover/ || exit 1
      timeout: 10s
    hostname: boxarr
    image: ghcr.io/iongpt/boxarr:latest
    labels:
      - traefik.http.routers.boxarr.middlewares=auth@file
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    user: 1000:1000
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/boxarr:/config
