services:
  traefik:
    # Docker sets ip_unprivileged_port_start=0 in bridge netns, so 80/443 need no capability.
    cap_drop:
      - ALL
    container_name: traefik
    hostname: traefik
    image: traefik:latest
    labels:
      - dockhand.update=false
      - observability.metrics.address=traefik:8080
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: 568:568
