services:
  traefik:
    cap_add:
      - NET_BIND_SERVICE
    cap_drop:
      - ALL
    container_name: traefik
    hostname: traefik
    image: traefik:latest
    labels:
      - dockhand.update=false
      - observability.metrics.address=traefik:8080
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
