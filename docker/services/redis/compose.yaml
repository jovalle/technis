services:
  redis:
    cap_add:
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --loglevel
      - warning
    container_name: redis
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 512M
        reservations:
          cpus: 0.1
          memory: 64M
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 10s
      test:
        - CMD
        - redis-cli
        - ping
      timeout: 5s
    hostname: redis
    image: redis:latest
    labels:
      - traefik.enable=false
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    user: 1000:1000
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/redis:/data
  redis-exporter:
    cap_drop:
      - ALL
    container_name: redis-exporter
    depends_on:
      redis:
        condition: service_healthy
        required: true
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 64M
        reservations:
          cpus: 0.05
          memory: 16M
    environment:
      - REDIS_ADDR=redis://redis:6379
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 15s
      test: [CMD, /redis_exporter, --version]
      timeout: 10s
    hostname: redis-exporter
    image: oliver006/redis_exporter:latest
    labels:
      - observability.metrics.address=redis-exporter:9121
      - traefik.enable=false
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
