services:
  sonarr:
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    container_name: sonarr
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 512M
        reservations:
          cpus: 0.25
          memory: 128M
    environment:
      - PGID=${PGID:-1000}
      - PUID=${PUID:-1000}
      - SONARR__SERVER__URLBASE=/series
      - TZ=${TZ:-America/New_York}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 1m0s
      test:
        - CMD-SHELL
        - curl -f http://127.0.0.1:8989/series/ping || exit 1
      timeout: 10s
    hostname: sonarr
    image: lscr.io/linuxserver/sonarr:latest
    labels:
      - gatus.group=acquisition
      - gatus.priority=P3
      - traefik.http.routers.sonarr.middlewares=auth@file
      - traefik.http.services.sonarr.loadbalancer.server.port=8989
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/sonarr:/config
      - /mnt/media/downloads:/downloads
      - /mnt/media/series:/series
