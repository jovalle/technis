services:
  sonarr:
    cap_drop:
      - ALL
    container_name: sonarr
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 2G
        reservations:
          cpus: 0.25
          memory: 128M
    environment:
      - SONARR__SERVER__URLBASE=/series
      - TZ=${TZ:-America/New_York}
      - UMASK=002
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 1m0s
      test:
        - CMD-SHELL
        - curl -f http://127.0.0.1:8989/series/ping || exit 1
      timeout: 10s
    hostname: sonarr
    image: lscr.io/linuxserver/sonarr:develop
    labels:
      - traefik.http.routers.sonarr.middlewares=auth@file
      - traefik.http.services.sonarr.loadbalancer.server.port=8989
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run:rw,nosuid,size=16m,uid=568,gid=568,exec
      - /tmp:rw,noexec,nosuid,size=64m,uid=568,gid=568
    user: 568:568
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/sonarr:/config
      - /mnt/media/downloads:/downloads
      - /mnt/media/series:/series
