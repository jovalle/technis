services:
  beszel-agent:
    cap_add:
      - CAP_PERFMON
      # smartctl needs RAWIO for SATA/ATA devices and SYS_ADMIN for NVMe.
      - CAP_SYS_ADMIN
      - CAP_SYS_RAWIO
    cap_drop:
      - ALL
    container_name: beszel-agent
    # Allow read-only access to every host block and character device so the
    # agent can discover the disks available on each host with smartctl.
    device_cgroup_rules:
      - b *:* r
      - c *:* r
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 64M
        reservations:
          cpus: 0.05
          memory: 16M
    devices:
      - permissions: rwm
        source: /dev/dri/card0
        target: /dev/dri/card0
    environment:
      - DOCKER_HOST=${BESZEL_AGENT_DOCKER_HOST:-tcp://docker-socket-proxy:2375}
      - HUB_URL=${BESZEL_AGENT_HUB_URL:?BESZEL_AGENT_HUB_URL is required}
      - KEY=${BESZEL_AGENT_KEY:?BESZEL_AGENT_KEY is required}
      - LISTEN=${BESZEL_AGENT_LISTEN:?BESZEL_AGENT_LISTEN is required}
      - TOKEN=${BESZEL_AGENT_TOKEN:?BESZEL_AGENT_TOKEN is required}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 15s
      test:
        - NONE
      timeout: 10s
    hostname: beszel-agent
    image: henrygd/beszel-agent-intel:latest
    network_mode: host
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /dev:/dev:ro
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/beszel-agent:/var/lib/beszel-agent
