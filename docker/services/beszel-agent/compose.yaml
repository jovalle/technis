services:
  beszel-agent:
    cap_drop:
      - ALL
    container_name: beszel-agent
    environment:
      - HUB_URL=https://beszel.techn.is
      - DISABLE_SSH=true
      # Read-only Docker API from docker-socket-proxy instead of the raw socket.
      - DOCKER_HOST=tcp://127.0.0.1:2375
      - KEY=${BESZEL_KEY:?BESZEL_KEY is required}
      - TOKEN=${BESZEL_TOKEN:?BESZEL_TOKEN is required}
      - SYSTEM_NAME=${TAILSCALE_HOSTNAME:?TAILSCALE_HOSTNAME is required}
    extra_hosts:
      - beszel.techn.is=100.100.1.3
    image: henrygd/beszel-agent:latest
    labels:
      - traefik.enable=false
    network_mode: host
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: 568:568
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/beszel-agent:/var/lib/beszel-agent
