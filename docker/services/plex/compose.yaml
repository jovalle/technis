services:
  plex:
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - KILL
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    container_name: plex
    deploy:
      resources:
        limits:
          cpus: 8
          memory: 8192M
        reservations:
          cpus: 2
          memory: 2048M
    devices:
      - /dev/dri:/dev/dri:rwm
    environment:
      - ADVERTISE_IP=${PLEX_ADVERTISE_IP:?PLEX_ADVERTISE_IP is required}
      - ALLOWED_NETWORKS=192.168.0.0/16,172.16.0.0/12
      # pms-docker reads PLEX_UID/PLEX_GID, not PUID/PGID; init stays root, the server runs as 568.
      - PLEX_GID=${PGID:-568}
      - PLEX_UID=${PUID:-568}
      - TZ=${TZ:-America/New_York}
      - UMASK_SET=${PLEX_UMASK_SET:?PLEX_UMASK_SET is required}
      - VERSION=${PLEX_VERSION:?PLEX_VERSION is required}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 1m0s
      test:
        - CMD-SHELL
        - curl -f http://127.0.0.1:32400/identity || exit 1
      timeout: 10s
    hostname: plex
    image: plexinc/pms-docker:latest
    labels:
      - traefik.enable=false
    network_mode: host
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/plex:/config
      - /mnt/media:/media:ro
      - /dev/shm/transcode:/transcode

  plex-discovery:
    cap_drop:
      - ALL
    command: [python, /app/discovery.py]
    container_name: plex-discovery
    image: python:3-slim
    network_mode: host
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: 568:568
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/plex/Library/Application Support/Plex Media Server:/plex:ro
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/plex/discovery.py:/app/discovery.py:ro
