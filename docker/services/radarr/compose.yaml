services:
  radarr:
    cap_drop:
      - ALL
    container_name: radarr
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 512M
        reservations:
          cpus: 0.25
          memory: 128M
    environment:
      - RADARR__SERVER__URLBASE=/movies
      - TZ=${TZ:-America/New_York}
      - UMASK=002
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 1m0s
      test:
        - CMD-SHELL
        - curl -f http://127.0.0.1:7878/movies/ping || exit 1
      timeout: 10s
    hostname: radarr
    image: lscr.io/linuxserver/radarr:latest
    labels:
      - traefik.http.routers.radarr.middlewares=auth@file
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run:rw,nosuid,size=16m,uid=568,gid=568,exec
      - /tmp:rw,noexec,nosuid,size=64m,uid=568,gid=568
    user: 568:568
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/radarr:/config
      - /mnt/media/downloads:/downloads
      - /mnt/media/movies:/movies
