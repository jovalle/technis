services:
  cadvisor:
    # Unprivileged: DAC_READ_SEARCH walks other users' layers for disk stats; SYSLOG reads /dev/kmsg for OOM events.
    cap_add:
      - DAC_READ_SEARCH
      - SYSLOG
    cap_drop:
      - ALL
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
      - --disable_metrics=referenced_memory,tcp,udp,advtcp
      - --store_container_labels=false
    container_name: cadvisor
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 512M
        reservations:
          cpus: 0.1
          memory: 128M
    devices:
      - /dev/kmsg:/dev/kmsg:r
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
        [CMD-SHELL, wget -q --spider http://127.0.0.1:8080/healthz || exit 1]
      timeout: 10s
    hostname: cadvisor
    image: ghcr.io/google/cadvisor:latest
    labels:
      - traefik.enable=false
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
