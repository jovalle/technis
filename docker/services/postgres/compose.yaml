services:
  postgres:
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    build:
      context: .
    cap_drop:
      - ALL
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - port=5432
      - -c
      - shared_preload_libraries=timescaledb
      - -c
      - timescaledb.license=timescale
      - -c
      - timescaledb.telemetry_level=off
      - -c
      - max_locks_per_transaction=4096
      - -c
      - max_worker_processes=27
      - -c
      - shared_buffers=512MB
    container_name: postgres
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 4096M
        reservations:
          cpus: 0.5
          memory: 512M
    environment:
      - PGDATA=${POSTGRES_PGDATA:?POSTGRES_PGDATA is required}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB is required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - TZ=${TZ:-America/New_York}
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 30s
      test:
        - CMD-SHELL
        - pg_isready -U postgres
      timeout: 5s
    hostname: postgres
    image: technis/postgres:pg17-timescaledb2.28.3
    labels:
      - traefik.enable=false
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    shm_size: 512m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/postgres:/var/lib/postgresql/data
