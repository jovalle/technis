services:
  lidarr:
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    container_name: lidarr
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 512M
        reservations:
          cpus: 0.25
          memory: 128M
    environment:
      - LIDARR__SERVER__URLBASE=/songs
      - PGID=${PGID:-1000}
      - PUID=${PUID:-1000}
      - TZ=${TZ:-America/New_York}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 1m0s
      test:
        - CMD-SHELL
        - curl -f http://127.0.0.1:8686/songs/ping || exit 1
      timeout: 10s
    hostname: lidarr
    image: lscr.io/linuxserver/lidarr:latest
    labels:
      - gatus.group=acquisition
      - gatus.priority=P3
      - traefik.http.routers.lidarr.middlewares=auth@file
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/lidarr:/config
      - /mnt/media/downloads:/downloads
      - /mnt/media/music:/music
