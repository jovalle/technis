services:
  lidarr:
    build: .
    cap_drop:
      - ALL
    container_name: lidarr
    deploy:
      resources:
        limits:
          cpus: 8
          memory: 8G
        reservations:
          cpus: 0.25
          memory: 128M
    environment:
      - LIDARR__SERVER__URLBASE=/songs
      - TZ=${TZ:-America/New_York}
      - UMASK=002
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 1m0s
      test:
        - CMD-SHELL
        - curl -f http://127.0.0.1:8686/songs/ping || exit 1
      timeout: 10s
    hostname: lidarr
    image: technis/lidarr:3.1.0.4875-stability.1
    labels:
      - com.centurylinklabs.watchtower.enable=false
      - traefik.http.routers.lidarr.middlewares=auth@file
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 2m
    tmpfs:
      - /run:rw,nosuid,size=16m,uid=568,gid=568,exec
      - /tmp:rw,noexec,nosuid,size=64m,uid=568,gid=568
    user: 568:568
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/lidarr:/config
      - /mnt/media/downloads:/downloads
      - /mnt/media/music:/music
      - /mnt/media/.lidarr-recycle:/recycle
