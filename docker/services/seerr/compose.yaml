services:
  seerr:
    cap_drop:
      - ALL
    container_name: seerr
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 1G
        reservations:
          cpus: 0.25
          memory: 256M
    environment:
      # 568 has no home in the image; npm writes its cache under HOME.
      - HOME=/tmp
      - TZ=${TZ:-America/New_York}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 1m0s
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:5055/api/v1/status || exit 1
      timeout: 10s
    hostname: seerr
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    ports:
      - 5055:5055
    labels:
      # Public {req,request,requests}.techn.is reach seerr through the Cloudflare tunnel, not Traefik.
      - traefik.http.routers.seerr.rule=Host(`seerr.techn.is`)
      - traefik.http.routers.seerr.service=seerr
      - traefik.http.services.seerr.loadbalancer.server.port=5055
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=568,gid=568
    user: 568:568
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/seerr:/app/config

  seerr-tracearr:
    cap_drop:
      - ALL
    command: [python, /app/adapter.py]
    container_name: seerr-tracearr
    environment:
      - ADAPTER_API_KEY=${ADAPTER_API_KEY:?ADAPTER_API_KEY is required}
      - TRACEARR_API_KEY=${TRACEARR_API_KEY:?TRACEARR_API_KEY is required}
      - TRACEARR_SERVER_ID=${TRACEARR_SERVER_ID:?TRACEARR_SERVER_ID is required}
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8181/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    image: python:3-slim
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: 568:568
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/seerr/adapter.py:/app/adapter.py:ro
