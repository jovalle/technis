services:
  gatus:
    cap_drop:
      - ALL
    container_name: gatus
    deploy:
      resources:
        limits:
          memory: 96M
        reservations:
          memory: 32M
    environment:
      - GATUS_CONFIG_PATH=/config/gatus.yaml
    hostname: gatus
    image: twinproduction/gatus:v5.36.0@sha256:c5f210d095fa78e6efaa20ffeb14803f2ba4f10615e16a6d12087697149617f0
    labels:
      - observability.metrics.address=gatus:8080
      - traefik.enable=false
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/gatus/data:/data
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/gatus/config/gatus.yaml:/config/gatus.yaml:ro
