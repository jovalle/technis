services:
  gatus:
    cap_drop:
      - ALL
    container_name: gatus
    deploy:
      resources:
        limits:
          memory: 96M
        reservations:
          memory: 32M
    environment:
      - GATUS_CONFIG_PATH=/config/gatus.yaml
    hostname: gatus
    image: ghcr.io/twin/gatus:latest
    labels:
      - observability.metrics.address=gatus:8080
      - traefik.enable=false
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: 568:568
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/gatus/data:/data
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/gatus/config/gatus.yaml:/config/gatus.yaml:ro
