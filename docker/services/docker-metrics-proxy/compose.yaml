services:
  docker-metrics-proxy:
    command:
      - TCP-LISTEN:9323,bind=${INTERNAL_IP},fork,reuseaddr
      - TCP:127.0.0.1:9323
    container_name: docker-metrics-proxy
    depends_on:
      tailscale:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: 0.1
          memory: 16M
        reservations:
          cpus: 0.01
          memory: 8M
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 15s
      test:
        - CMD-SHELL
        - wget -q --spider http://${INTERNAL_IP}:9323/metrics || exit 1
      timeout: 10s
    hostname: docker-metrics-proxy
    image: alpine/socat:latest
    labels:
      - traefik.enable=false
    network_mode: host
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
