services:
  go-check:
    build:
      context: .
    cap_drop:
      - ALL
    container_name: go-check
    deploy:
      resources:
        limits:
          cpus: 0.1
          memory: 32M
        reservations:
          cpus: 0.01
          memory: 8M
    environment:
      GO_CHECK_LOG_LEVEL: ${GO_CHECK_LOG_LEVEL:-info}
    image: go-check:local
    labels:
      - traefik.enable=false
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
