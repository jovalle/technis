services:
  alloy:
    cap_drop:
      - ALL
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    container_name: alloy
    depends_on:
      cadvisor:
        condition: service_healthy
        required: true
      docker-socket-proxy:
        condition: service_healthy
        required: true
    deploy:
      resources:
        limits:
          cpus: 0.75
          memory: 768M
        reservations:
          cpus: 0.1
          memory: 128M
    environment:
      - OBSERVABILITY_HOST=${OBSERVABILITY_HOST:-unknown}
      - OBSERVABILITY_SITE=${OBSERVABILITY_SITE:-unknown}
      - OBSERVABILITY_STACK=${OBSERVABILITY_STACK:-unknown}
    expose:
      - 4317
      - 4318
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test: [CMD, /bin/alloy, validate, /etc/alloy/config.alloy]
      timeout: 10s
    hostname: alloy
    image: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
    labels:
      - traefik.enable=false
    pid: host
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    user: root
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/alloy/data:/var/lib/alloy
      - /proc:/host/proc:ro
      - /run/log/journal:/run/log/journal:ro
      - /run/udev/data:/run/udev/data:ro
      - /sys:/host/sys:ro
      - /var/log/journal:/var/log/journal:ro
      - /:/rootfs:ro
