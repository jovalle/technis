services:
  alloy:
    cap_drop:
      - ALL
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    container_name: alloy
    depends_on:
      cadvisor:
        condition: service_healthy
        required: true
      docker-socket-proxy:
        condition: service_healthy
        required: true
    deploy:
      resources:
        limits:
          cpus: 0.75
          memory: 768M
        reservations:
          cpus: 0.1
          memory: 128M
    environment:
      - OBSERVABILITY_HOST=${OBSERVABILITY_HOST:-unknown}
      - OBSERVABILITY_SITE=${OBSERVABILITY_SITE:-unknown}
      - OBSERVABILITY_STACK=${OBSERVABILITY_STACK:-unknown}
    expose:
      - 4317
      - 4318
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test: [CMD, /bin/alloy, validate, /etc/alloy/config.alloy]
      timeout: 10s
    hostname: alloy
    image: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
    labels:
      - traefik.enable=false
    pid: host
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    user: root
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/alloy/data:/var/lib/alloy
      - /proc:/host/proc:ro
      - /run/log/journal:/run/log/journal:ro
      - /run/udev/data:/run/udev/data:ro
      - /sys:/host/sys:ro
      - /var/log/journal:/var/log/journal:ro
      - /:/rootfs:ro
  # Host namespaces are required: /proc/net is relative to the reader's network namespace.
  alloy-host:
    image: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
    container_name: alloy-host
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12346
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    network_mode: host
    pid: host
    user: root
    read_only: true
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [SYS_PTRACE, DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true]
    environment:
      OBSERVABILITY_HOST: ${OBSERVABILITY_HOST:-${COMPOSE_PROJECT_NAME}}
      OBSERVABILITY_SITE: ${OBSERVABILITY_SITE:-home}
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/alloy/host/config.alloy:/etc/alloy/config.alloy:ro
      - ${STACK_DATA_ROOT}/alloy/host/data:/var/lib/alloy
      - ${STACK_DATA_ROOT}/alloy/host/textfile:/textfile:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
      - /run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
      - /run/udev/data:/run/udev/data:ro
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 512M
    healthcheck:
      test: [CMD-SHELL, "bash -c 'echo > /dev/tcp/127.0.0.1/12346'"]
      interval: 30s
      timeout: 5s
      retries: 3
  kernel-exporter:
    image: python:3.13-slim@sha256:9d2e5553305c7c7b0097999bb17187c69b921ccd6bc9d40e4bb5ebe652c00285
    container_name: kernel-exporter
    command: [python3, /app/kernel_exporter.py]
    pid: host
    user: root
    read_only: true
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [SYS_PTRACE, DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true]
    environment:
      DOCKER_API: http://docker-socket-proxy:2375
      EXPORT_INTERVAL: "5"
    volumes:
      - ${STACK_DATA_ROOT}/alloy/host/kernel_exporter.py:/app/kernel_exporter.py:ro
      - ${STACK_DATA_ROOT}/alloy/host/textfile:/textfile
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 192M
    healthcheck:
      test:
        [
          CMD,
          python3,
          -c,
          "import os,time; assert time.time()-os.stat('/textfile/kernel.prom').st_mtime < 30",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
