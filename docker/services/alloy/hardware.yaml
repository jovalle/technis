services:
  smartctl-exporter:
    image: quay.io/prometheuscommunity/smartctl-exporter:latest
    container_name: smartctl-exporter
    network_mode: host
    command:
      - --web.listen-address=127.0.0.1:9633
      - --smartctl.interval=60s
    user: root
    cap_drop: [ALL]
    cap_add: [SYS_RAWIO, SYS_ADMIN]
    read_only: true
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    # Device mappings are discovered by deploy.py from smartctl --scan.
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 128M
  drm-exporter:
    image: ghcr.io/home-operations/drm-exporter:latest
    container_name: drm-exporter
    network_mode: host
    environment:
      DRM_EXPORTER_ADDRESS: 127.0.0.1
      DRM_EXPORTER_PORT: "9634"
      DRM_EXPORTER_INTERVAL_SECONDS: "5"
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /sys:/sys:ro
    cap_drop: [ALL]
    cap_add: [PERFMON]
    read_only: true
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 128M
  nvidia-gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:latest
    container_name: nvidia-gpu-exporter
    network_mode: host
    command: ["--web.listen-address=127.0.0.1:9835"]
    environment:
      NVIDIA_DRIVER_CAPABILITIES: utility
      NVIDIA_VISIBLE_DEVICES: all
    gpus: all
    cap_drop: [ALL]
    read_only: true
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 128M
