services:
  tracearr:
    cap_drop:
      - ALL
    container_name: tracearr
    depends_on:
      postgres:
        condition: service_healthy
        required: true
        restart: true
      redis:
        condition: service_healthy
        required: true
        restart: true
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 2048M
        reservations:
          cpus: 0.5
          memory: 512M
    environment:
      - BASE_PATH=/dashboard
      - CORS_ORIGIN=https://${SECONDARY_DOMAIN:?SECONDARY_DOMAIN is required}
      - COOKIE_SECRET_FILE=/data/tracearr/.cookie_secret
      - DATABASE_POOL_MAX=20
      - DATABASE_URL_FILE=/data/tracearr/.database_url
      - JWT_SECRET_FILE=/data/tracearr/.jwt_secret
      - LOG_LEVEL=${TRACEARR_LOG_LEVEL:?TRACEARR_LOG_LEVEL is required}
      # Dedicated DB index: Tracearr runs FLUSHDB during in-app restores.
      - REDIS_URL=redis://redis:6379/3
      - TRUST_PROXY=true
      - TZ=${TZ:-America/New_York}
    expose:
      - "3000"
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 2m0s
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:3000/health || exit 1
      timeout: 10s
    hostname: tracearr
    image: ghcr.io/connorgallopo/tracearr:2.5.0
    labels:
      # Public dash.techn.is reaches tracearr through the Cloudflare tunnel, not Traefik.
      - traefik.http.routers.tracearr.rule=Host(`tracearr.techn.is`)
      - traefik.http.routers.tracearr.service=tracearr
      - traefik.http.services.tracearr.loadbalancer.server.port=3000
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/tracearr/tracearr:/data/tracearr
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/tracearr/backup:/data/backup
