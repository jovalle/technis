services:
  qbittorrent:
    cap_drop:
      - ALL
    container_name: qbittorrent
    depends_on:
      gluetun:
        condition: service_healthy
        required: true
        restart: true
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 2048M
        reservations:
          cpus: 0.5
          memory: 256M
    environment:
      - TZ=${TZ:-America/New_York}
      - UMASK=002
      - WEBUI_PORT=${QBITTORRENT_WEBUI_PORT:?QBITTORRENT_WEBUI_PORT is required}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 1m0s
      test:
        - CMD-SHELL
        - curl -fsS --max-time 3 http://127.0.0.1:9999/ && curl -fsS --max-time 3 http://127.0.0.1:10095/
      timeout: 10s
    image: lscr.io/linuxserver/qbittorrent:latest
    labels:
      - traefik.enable=false
    network_mode: service:gluetun
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run:rw,nosuid,size=16m,uid=568,gid=568,exec
      - /tmp:rw,noexec,nosuid,size=64m,uid=568,gid=568
    user: 568:568
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/qbittorrent:/config
      - /mnt/media/downloads:/downloads
