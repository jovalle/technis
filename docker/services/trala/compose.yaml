services:
  trala:
    cap_drop:
      - ALL
    container_name: trala
    depends_on:
      traefik:
        condition: service_healthy
        required: true
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 128M
        reservations:
          cpus: 0.1
          memory: 64M
    environment:
      - LOG_LEVEL=${TRALA_LOG_LEVEL:?TRALA_LOG_LEVEL is required}
      - REFRESH_INTERVAL_SECONDS=${TRALA_REFRESH_INTERVAL_SECONDS:?TRALA_REFRESH_INTERVAL_SECONDS is required}
      - SEARCH_ENGINE_URL=${TRALA_SEARCH_ENGINE_URL:?TRALA_SEARCH_ENGINE_URL is required}
      - TRAEFIK_API_HOST=${TRALA_TRAEFIK_API_HOST:?TRALA_TRAEFIK_API_HOST is required}
      - TZ=${TZ:-America/New_York}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/api/health || exit 1
      timeout: 10s
    hostname: trala
    image: ghcr.io/dannybouwers/trala:0.15.0
    labels:
      - gatus.group=curation
      - gatus.priority=P3
      - traefik.http.routers.trala.middlewares=auth@file
      - traefik.http.services.trala.loadbalancer.server.port=8080
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/trala/configuration.yml:/config/configuration.yml:ro
