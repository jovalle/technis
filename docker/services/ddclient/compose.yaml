services:
  ddclient:
    cap_drop:
      - ALL
    container_name: ddclient
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 64M
        reservations:
          cpus: 0.02
          memory: 16M
    environment:
      - DDCLIENT_CLOUDFLARE_API_TOKEN=${TRAEFIK_CLOUDFLARE_DNS_API_TOKEN:?TRAEFIK_CLOUDFLARE_DNS_API_TOKEN is required}
      - DDCLIENT_HOSTNAME=${TAILSCALE_HOSTNAME:?TAILSCALE_HOSTNAME is required}.techn.is
      - TZ=${TZ:-America/New_York}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        printf '%s\n' \
          'daemon=300' \
          'foreground=yes' \
          'syslog=no' \
          'quiet=no' \
          'usev4=webv4' \
          'webv4=ipify-ipv4' \
          'protocol=cloudflare' \
          'zone=techn.is' \
          'login=token' \
          'password_env=DDCLIENT_CLOUDFLARE_API_TOKEN' \
          "$$DDCLIENT_HOSTNAME" > /config/ddclient.conf
        exec /init
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
        - CMD-SHELL
        - s6-svstat -u /run/service/svc-ddclient | grep -qx true || exit 1
      timeout: 5s
    hostname: ddclient
    image: lscr.io/linuxserver/ddclient:latest
    labels:
      - traefik.enable=false
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run:rw,nosuid,size=16m,uid=568,gid=568,exec
      - /tmp:rw,noexec,nosuid,size=16m,uid=568,gid=568
    user: 568:568
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/ddclient/config:/config
