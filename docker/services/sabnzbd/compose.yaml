services:
  sabnzbd:
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    container_name: sabnzbd
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 2048M
        reservations:
          cpus: 0.5
          memory: 256M
    environment:
      - HAS_IPV6=true
      - PGID=${PGID:-1000}
      - PUID=${PUID:-1000}
      - TZ=${TZ:-America/New_York}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 1m0s
      test:
        - CMD-SHELL
        - curl -f http://127.0.0.1:8080/nzb/api?mode=version || exit 1
      timeout: 10s
    hostname: sabnzbd
    image: lscr.io/linuxserver/sabnzbd:latest
    labels:
      - gatus.group=acquisition
      - gatus.priority=P3
      - traefik.http.routers.sabnzbd.middlewares=auth@file
    ports:
      - 8081:8080
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    sysctls:
      - net.ipv6.bindv6only=1
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/sabnzbd:/config
      - /mnt/media/downloads:/downloads
