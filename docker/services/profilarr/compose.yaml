services:
  profilarr:
    cap_drop:
      - ALL
    container_name: profilarr
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 2G
        reservations:
          cpus: 0.1
          memory: 256M
    environment:
      - AUTH=${PROFILARR_AUTH:-off}
      - HOME=/config
      - ORIGIN=https://${PROFILARR_ROOT_DOMAIN:?PROFILARR_ROOT_DOMAIN is required}
      - TZ=${TZ:-America/New_York}
    expose:
      - "6868"
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
        - CMD-SHELL
        - timeout 2 bash -c '</dev/tcp/127.0.0.1/6868' || exit 1
      timeout: 10s
    hostname: profilarr
    image: ghcr.io/dictionarry-hub/profilarr:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=568,gid=568
    user: ${PUID:-568}:${PGID:-568}
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/profilarr:/config
