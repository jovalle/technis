services:
  watcharr:
    cap_drop:
      - ALL
    container_name: watcharr
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 512M
        reservations:
          cpus: 0.25
          memory: 128M
    environment:
      - TZ=${TZ:-America/New_York}
      - WATCHARR_DATA=/data
    expose:
      - "3080"
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:3080/api/auth/available || exit 1
      timeout: 10s
    hostname: watcharr
    image: ghcr.io/sbondco/watcharr:v4.2.1
    labels:
      - gatus.group=curation
      - gatus.priority=P3
      - traefik.docker.network=nexus_default
      - traefik.enable=true
      - traefik.http.routers.watcharr.entrypoints=websecure
      - traefik.http.routers.watcharr.rule=Host(`watch.techn.is`) || Host(`watcharr.techn.is`)
      - traefik.http.routers.watcharr.service=watcharr
      - traefik.http.routers.watcharr.tls.certresolver=letsencrypt
      - traefik.http.routers.watcharr.tls=true
      - traefik.http.services.watcharr.loadbalancer.server.port=3080
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    networks:
      - default
      - coolify
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/watcharr:/data
