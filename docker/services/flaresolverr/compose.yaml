services:
  flaresolverr:
    cap_drop:
      - ALL
    container_name: flaresolverr
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 1024M
        reservations:
          cpus: 0.25
          memory: 256M
    environment:
      - CAPTCHA_SOLVER=${FLARESOLVERR_CAPTCHA_SOLVER:?FLARESOLVERR_CAPTCHA_SOLVER is required}
      - LOG_HTML=${FLARESOLVERR_LOG_HTML:?FLARESOLVERR_LOG_HTML is required}
      - LOG_LEVEL=${FLARESOLVERR_LOG_LEVEL:?FLARESOLVERR_LOG_LEVEL is required}
      - TZ=${TZ:-America/New_York}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 1m0s
      test:
        - CMD-SHELL
        - curl -f http://127.0.0.1:8191/health || exit 1
      timeout: 10s
    hostname: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest@sha256:0ad4f5fa4a87fe922a66171995acc3ac2e20d894fbef60779260b518370a991e
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    # Stays on the image's UID: FlareSolverr patches /app/chromedriver in place at startup.
    user: flaresolverr
