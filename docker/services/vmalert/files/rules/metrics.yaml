groups:
  - name: fleet-hosts
    interval: 30s
    rules:
      - alert: HostTelemetryMissing
        expr: up{job="node"} == 0
        for: 2m
        keep_firing_for: 2m
        labels:
          priority: P1
          service: observability
        annotations:
          summary: Host telemetry is unavailable
          description: No host metrics are available from {{ $labels.host }}.
      - alert: ScrapeFailed
        expr: up == 0
        for: 5m
        keep_firing_for: 2m
        labels:
          priority: P2
          service: observability
        annotations:
          summary: Metrics scrape is failing
          description: The {{ $labels.job }} target on {{ $labels.host }} has failed for five minutes.
      - alert: FilesystemReadOnly
        expr: node_filesystem_readonly{job="node",fstype!~"squashfs|iso9660|overlay|tmpfs"} == 1
        for: 1m
        labels:
          priority: P1
          service: storage
        annotations:
          summary: Filesystem is read-only
          description: "{{ $labels.mountpoint }} on {{ $labels.host }} is read-only."
      - alert: FilesystemSpaceLow
        expr:
          (node_filesystem_avail_bytes{job="node",fstype!~"tmpfs|overlay|squashfs|autofs"} / node_filesystem_size_bytes{job="node"} < 0.10) and
          (node_filesystem_avail_bytes{job="node"} < 20 * 1024^3)
        for: 15m
        labels:
          priority: P1
          service: storage
        annotations:
          summary: Filesystem space is low
          description: "{{ $labels.mountpoint }} on {{ $labels.host }} has less than 10% and 20 GiB free."
      - alert: MemoryPressure
        expr: rate(node_pressure_memory_stalled_seconds_total{job="node"}[5m]) > 0.10
        for: 5m
        labels:
          priority: P2
          service: host
        annotations:
          summary: Sustained memory pressure
          description: Processes on {{ $labels.host }} are stalled on memory.
      - alert: CPUHigh
        expr: 1 - avg by (host) (rate(node_cpu_seconds_total{job="node",mode="idle"}[5m])) > 0.95
        for: 15m
        labels:
          priority: P2
          service: host
        annotations:
          summary: CPU is persistently busy
          description: CPU utilization on {{ $labels.host }} has exceeded 95% for fifteen minutes.
  - name: fleet-services
    interval: 30s
    rules:
      - alert: ServiceCheckFailed
        expr: gatus_results_endpoint_success == 0
        for: 5m
        labels:
          priority: P2
          service: availability
        annotations:
          summary: Availability check is failing
          description: "{{ $labels.name }} is failing from {{ $labels.host }}."
      - alert: CloudflaredDisconnected
        expr: cloudflared_tunnel_ha_connections < 1
        for: 2m
        labels:
          priority: P1
          service: cloudflared
        annotations:
          summary: Cloudflare Tunnel has no active connections
          description: "{{ $labels.host }} has no active tunnel connections."
      - alert: TraefikErrorRateHigh
        expr: sum by (host) (rate(traefik_entrypoint_requests_total{code=~"5.."}[5m])) > 0.1
        for: 10m
        labels:
          priority: P2
          service: traefik
        annotations:
          summary: Traefik 5xx rate is elevated
          description: "{{ $labels.host }} is returning elevated HTTP 5xx responses."
      - alert: PostgreSQLUnavailable
        expr: pg_up == 0
        for: 2m
        labels:
          priority: P1
          service: postgres
        annotations:
          summary: PostgreSQL exporter cannot reach the database
          description: PostgreSQL on {{ $labels.host }} has been unavailable for two minutes.
      - alert: PostgreSQLConnectionsHigh
        expr: sum by (host) (pg_stat_activity_count) > 0.8 * sum by (host) (pg_settings_max_connections)
        for: 10m
        labels:
          priority: P2
          service: postgres
        annotations:
          summary: PostgreSQL connections are near capacity
          description: PostgreSQL on {{ $labels.host }} has used more than 80% of available connections.
      - alert: RedisUnavailable
        expr: redis_up == 0
        for: 2m
        labels:
          priority: P1
          service: redis
        annotations:
          summary: Redis exporter cannot reach the database
          description: Redis on {{ $labels.host }} has been unavailable for two minutes.
      - alert: RedisRejectedConnections
        expr: increase(redis_rejected_connections_total[5m]) > 0
        labels:
          priority: P2
          service: redis
        annotations:
          summary: Redis rejected client connections
          description: Redis on {{ $labels.host }} rejected one or more connections in five minutes.
  - name: observability-control-plane
    interval: 30s
    rules:
      - alert: MetricsStoreReadOnly
        expr: vm_storage_is_read_only == 1
        for: 1m
        labels:
          priority: P1
          service: victoriametrics
        annotations:
          summary: VictoriaMetrics is read-only
          description: VictoriaMetrics cannot accept writes; inspect Nexus storage immediately.
      - alert: LogsStoreReadOnly
        expr: vl_storage_is_read_only == 1
        for: 1m
        labels:
          priority: P1
          service: victorialogs
        annotations:
          summary: VictoriaLogs is read-only
          description: VictoriaLogs cannot accept writes; inspect Nexus storage immediately.
      - alert: AlloyRemoteWriteLagging
        expr: time() - prometheus_remote_storage_queue_highest_sent_timestamp_seconds > 300
        for: 5m
        labels:
          priority: P2
          service: alloy
        annotations:
          summary: Alloy metric delivery is delayed
          description: Metrics from {{ $labels.host }} are more than five minutes behind.
      - alert: AlloyRemoteWriteDropping
        expr: increase(prometheus_remote_storage_samples_dropped_total[5m]) > 0
        labels:
          priority: P1
          service: alloy
        annotations:
          summary: Alloy dropped metrics
          description: Alloy on {{ $labels.host }} dropped metric samples.
  - name: technis-diagnostic-signals
    interval: 30s
    rules:
      - record: technis:signal
        expr: 1 - avg by (host) (rate(node_cpu_seconds_total{job="node",mode="idle"}[1m]))
        labels:
          signal: cpu_busy_ratio
      - record: technis:signal
        expr: max by (host) (1 - node_memory_MemAvailable_bytes{job="node"} / node_memory_MemTotal_bytes{job="node"})
        labels:
          signal: memory_used_ratio
      - record: technis:signal
        expr: max by (host) (technis_pressure_average_ratio{job="node",resource="cpu",scope="some",window="10"})
        labels:
          signal: cpu_pressure_ratio
      - record: technis:signal
        expr: max by (host) (technis_pressure_average_ratio{job="node",resource="memory",scope="some",window="10"})
        labels:
          signal: memory_pressure_ratio
      - record: technis:signal
        expr: max by (host) (technis_pressure_average_ratio{job="node",resource="io",scope="some",window="10"})
        labels:
          signal: io_pressure_ratio
      - record: technis:signal
        expr: sum by (host) (rate(node_disk_read_bytes_total{job="node",device!~"loop.*|dm-.*"}[1m])) / 1024^2
        labels:
          signal: disk_read_mib_s
      - record: technis:signal
        expr: sum by (host) (rate(node_disk_written_bytes_total{job="node",device!~"loop.*|dm-.*"}[1m])) / 1024^2
        labels:
          signal: disk_write_mib_s
      - record: technis:signal
        expr: sum by (host) (rate(node_network_receive_bytes_total{job="node",device!~"lo|veth.*|br-.*|docker.*|tailscale.*"}[1m])) / 1024^2
        labels:
          signal: network_receive_mib_s
      - record: technis:signal
        expr: sum by (host) (rate(node_netstat_Tcp_RetransSegs{job="node"}[1m]))
        labels:
          signal: tcp_retransmits_s
      - record: technis:signal
        expr: sum by (host) (rate(node_context_switches_total{job="node"}[1m]))
        labels:
          signal: context_switches_s
  - name: technis-diagnostic-baselines
    interval: 30s
    rules:
      - record: technis:baseline_mean
        expr: avg_over_time(technis:signal[24h] offset 5m)
      - record: technis:baseline_stddev
        expr: stddev_over_time(technis:signal[24h] offset 5m)
      - record: technis:baseline_samples
        expr: count_over_time(technis:signal[24h] offset 5m)
  - name: technis-diagnostic-scores
    interval: 30s
    rules:
      - record: technis:anomaly_score
        expr: (abs(technis:signal - technis:baseline_mean) / clamp_min(technis:baseline_stddev, 0.02)) and (technis:baseline_samples >= 120)
      - record: technis:upper_band
        expr: (technis:baseline_mean + 3 * clamp_min(technis:baseline_stddev, 0.02)) and (technis:baseline_samples >= 120)
      - record: technis:lower_band
        expr: clamp_min(technis:baseline_mean - 3 * clamp_min(technis:baseline_stddev, 0.02), 0) and (technis:baseline_samples >= 120)
  - name: technis-diagnostic-coverage
    interval: 30s
    rules:
      - alert: HostDiagnosticTelemetryMissing
        expr: absent(technis_collector_timestamp_seconds{host="stargate"}) or (time() - technis_collector_timestamp_seconds{host="stargate"} > 60)
        for: 5m
        labels:
          host: stargate
          priority: P2
          service: observability
        annotations:
          summary: Host diagnostic telemetry is missing
          description: Check host-observer and kernel-exporter before trusting empty panels.
      - alert: HostDiagnosticTelemetryMissing
        expr: absent(technis_collector_timestamp_seconds{host="nexus"}) or (time() - technis_collector_timestamp_seconds{host="nexus"} > 60)
        for: 5m
        labels:
          host: nexus
          priority: P2
          service: observability
        annotations:
          summary: Host diagnostic telemetry is missing
          description: Check host-observer and kernel-exporter before trusting empty panels.
      - alert: HostDiagnosticTelemetryMissing
        expr:
          absent(technis_collector_timestamp_seconds{host="mothership"}) or (time() - technis_collector_timestamp_seconds{host="mothership"} >
          60)
        for: 5m
        labels:
          host: mothership
          priority: P2
          service: observability
        annotations:
          summary: Host diagnostic telemetry is missing
          description: Check host-observer and kernel-exporter before trusting empty panels.
      - alert: HardwareExporterMissing
        expr: technis_expected_exporter unless on(host,exporter) label_replace(up{job=~"smartctl|drm|nvidia"} == 1,"exporter","$1","job","(.*)")
        for: 5m
        labels:
          priority: P2
          service: observability
        annotations:
          summary: An expected hardware exporter is unavailable
      - alert: DiskSMARTFailed
        expr: smartctl_device_smart_status == 0 or smartctl_device_critical_warning > 0
        for: 5m
        labels:
          priority: P2
          service: storage
        annotations:
          summary: Disk reports failed SMART health or an NVMe critical warning
      - alert: NVIDIATelemetryFailed
        expr: nvidia_smi_last_collect_success == 0
        for: 5m
        labels:
          priority: P2
          service: observability
        annotations:
          summary: NVIDIA exporter cannot collect GPU telemetry
      - alert: SupplementalCollectorFailed
        expr: technis_collector_success == 0 or node_textfile_scrape_error{job="node"} == 1
        for: 5m
        labels:
          priority: P2
          service: observability
        annotations:
          summary: Diagnostic collection is incomplete
      - alert: CgroupDiscoveryTruncated
        expr: technis_cgroup_discovery_truncated > 0
        for: 5m
        labels:
          priority: P2
          service: observability
        annotations:
          summary: Host exceeds the diagnostic cgroup discovery limit
