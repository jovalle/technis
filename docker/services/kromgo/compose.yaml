services:
  kromgo:
    cap_drop:
      - ALL
    container_name: kromgo
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 64M
        reservations:
          cpus: 0.05
          memory: 16M
    environment:
      - PROMETHEUS_URL=http://vmauth:8427
    hostname: kromgo
    image: ghcr.io/kashalls/kromgo:latest
    labels:
      - traefik.enable=true
      # Public stat.techn.is reaches kromgo through the Cloudflare tunnel, not Traefik.
      - traefik.http.routers.kromgo.rule=Host(`kromgo.techn.is`)
      - traefik.http.routers.kromgo.service=kromgo
      - traefik.http.services.kromgo.loadbalancer.server.port=8080
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: 1000:1000
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/kromgo/kromgo.yaml:/kromgo/config.yaml:ro
