services:
  # Public {w,wt,watch}.techn.is reach watchtower through the nexus Cloudflare tunnel, not Traefik.
  watchtower:
    command:
      [node, --import, /run/read-provider-env.mjs, --import, tsx, server.ts]
    cap_drop:
      - ALL
    container_name: watchtower
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 1G
        reservations:
          cpus: 0.1
          memory: 128M
    environment:
      - SECURE_COOKIES=true
      - TZ=${TZ:-America/New_York}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:9001/ || exit 1
      timeout: 10s
    hostname: watchtower
    image: sha256:d60da273de44005cf549bca413f51188b0da6a4f35e25dda4bcf25986720fd25
    pull_policy: never
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    user: 1001:1001
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/watchtower:/data
      - /run/watchtower-tv-credentials:/run/watchtower-credentials:ro
      - /var/lib/watchtower-tv/read-provider-env.mjs:/run/read-provider-env.mjs:ro
