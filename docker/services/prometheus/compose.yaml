services:
  prometheus:
    cap_drop:
      - ALL
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    container_name: prometheus
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 512M
        reservations:
          cpus: 0.1
          memory: 128M
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 20s
      test:
        [CMD-SHELL, wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1]
      timeout: 10s
    hostname: prometheus
    image: prom/prometheus@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    labels:
      - traefik.enable=false
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    user: 1000:1000
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/prometheus/config:/etc/prometheus:ro
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/prometheus/data:/prometheus
