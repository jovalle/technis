global:
  resolve_timeout: 5m
route:
  receiver: quiet
  group_by: [alertname, host, service, priority]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 24h
  routes:
    - receiver: ntfy-p1
      matchers: ['priority="P1"']
      group_wait: 10s
    - receiver: ntfy-p2
      matchers: ['priority="P2"']
      active_time_intervals: [waking-hours]
    - receiver: ntfy-p3
      matchers: ['priority="P3"']
      active_time_intervals: [waking-hours]
time_intervals:
  - name: waking-hours
    time_intervals:
      - location: America/New_York
        times:
          - start_time: "08:00"
            end_time: "22:00"
inhibit_rules:
  - source_matchers: ['alertname="HostTelemetryMissing"']
    target_matchers: ['alertname!="HostTelemetryMissing"']
    equal: [host]
receivers:
  - name: quiet
  - name: ntfy-p1
    webhook_configs:
      - url: https://ntfy.techn.is/alerts?template=technis-alertmanager
        send_resolved: true
        http_config: &ntfy-auth
          authorization:
            type: Bearer
            credentials_file: /run/secrets/ntfy-token
  - name: ntfy-p2
    webhook_configs:
      - url: https://ntfy.techn.is/alerts?template=technis-alertmanager
        send_resolved: true
        http_config: *ntfy-auth
  - name: ntfy-p3
    webhook_configs:
      - url: https://ntfy.techn.is/alerts?template=technis-alertmanager
        send_resolved: true
        http_config: *ntfy-auth
