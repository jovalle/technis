services:
  wizarr:
    cap_drop:
      - ALL
    container_name: wizarr
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 512M
        reservations:
          cpus: 0.05
          memory: 128M
    environment:
      # Started as 568, the entrypoint skips its root chown and su-exec step.
      - HOME=/tmp
      - CF_ACCESS_TEAM_DOMAIN=${WIZARR_CF_ACCESS_TEAM_DOMAIN:?WIZARR_CF_ACCESS_TEAM_DOMAIN is required}
      - CF_ACCESS_AUD=${WIZARR_CF_ACCESS_AUD:?WIZARR_CF_ACCESS_AUD is required}
      - TZ=${TZ:-America/New_York}
      - UV_CACHE_DIR=/tmp/uv
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
        - CMD-SHELL
        - curl -f http://127.0.0.1:5690 || exit 1
      timeout: 10s
    hostname: wizarr
    image: ghcr.io/wizarrrr/wizarr:latest
    ports:
      - 5690:5690
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=568,gid=568
    user: 568:568
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/wizarr/database:/data/database
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/wizarr/wizard_steps:/data/wizard_steps
