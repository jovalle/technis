# The UPSes have no serial numbers. Keep each tied to its Beacon hub port.
maxretry = 3

[ups1]
  driver = usbhid-ups
  port = auto
  vendorid = 09ae
  productid = 2012
  busport = "0*3"
  desc = "Hub port 3"

[ups2]
  driver = usbhid-ups
  port = auto
  vendorid = 09ae
  productid = 2012
  busport = "0*4"
  desc = "Hub port 4"
