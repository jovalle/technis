services:
  vmauth:
    cap_drop:
      - ALL
    command:
      - -auth.config=/etc/vmauth/auth.yaml
      - -httpListenAddr=:8427
      - -maxConcurrentPerUserRequests=100
      - -maxConcurrentRequests=300
    container_name: vmauth
    depends_on:
      tailscale:
        condition: service_healthy
        required: true
        restart: true
      tempo:
        condition: service_started
        required: true
      victorialogs:
        condition: service_healthy
        required: true
      victoriametrics:
        condition: service_healthy
        required: true
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 256M
        reservations:
          cpus: 0.05
          memory: 32M
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 15s
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8427/health]
      timeout: 10s
    hostname: vmauth
    image: victoriametrics/vmauth:v1.151.0
    labels:
      - observability.metrics.address=vmauth:8427
      - traefik.enable=false
    ports:
      - 100.100.1.3:8427:8427/tcp
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/vmauth/auth.yaml:/etc/vmauth/auth.yaml:ro
