include:
  - path:
      - ../../services/alloy/compose.yaml
      - services/alloy/compose.yaml
    env_file: &env
      - ../../.env
      - .env
  - path: ../../services/atuin/compose.yaml
    env_file: *env
  - path:
      - ../../services/cadvisor/compose.yaml
      - services/cadvisor/compose.yaml
    env_file: *env
  - path: services/cloudflared/compose.yaml
    env_file: *env
  - path:
      - ../../services/docker-socket-proxy/compose.yaml
      - services/docker-socket-proxy/compose.yaml
    env_file: *env
  - path: ../../services/external-dns/compose.yaml
    env_file: *env
  - path:
      - ../../services/go-check/compose.yaml
      - services/go-check/compose.yaml
    env_file: *env
  - path:
      - ../../services/gluetun/compose.yaml
      - services/gluetun/compose.yaml
    env_file: *env
  - path: ../../services/hawser/compose.yaml
    env_file: *env
  - path:
      - ../../services/host-observer/compose.yaml
      - services/host-observer/compose.yaml
    env_file: *env
  - path: ../../services/netdata/compose.yaml
    env_file: *env
  - path: ../../services/tailscale/compose.yaml
    env_file: *env
  - path:
      - ../../services/technitium/compose.yaml
      - services/technitium/compose.yaml
    env_file: *env
  - path:
      - ../../services/traefik/compose.yaml
      - services/traefik/compose.yaml
    env_file: *env

name: mothership

networks:
  external:
    driver: bridge
    enable_ipv6: true
    name: external
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.52.0.0/16
    name: internal
  status:
    driver: bridge
    enable_ipv6: true
    name: status
