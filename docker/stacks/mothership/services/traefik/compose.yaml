services:
  traefik:
    labels:
      - observability.metrics.address=traefik:8082
      - traefik.enable=true
      - traefik.http.routers.prometheus.entrypoints=metrics
      - traefik.http.routers.prometheus.rule=PathPrefix(`/metrics`)
      - traefik.http.routers.prometheus.service=prometheus@internal
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
        required: true
      tailscale:
        condition: service_healthy
        required: true
        restart: true
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    environment:
      - ACME_EMAIL=${TRAEFIK_ACME_EMAIL:?TRAEFIK_ACME_EMAIL is required}
      - CF_DNS_API_TOKEN=${TRAEFIK_CF_DNS_API_TOKEN:?TRAEFIK_CF_DNS_API_TOKEN is required}
      - DOMAIN=${TRAEFIK_DOMAIN:?TRAEFIK_DOMAIN is required}
      - EXTERNAL_IP=${TRAEFIK_EXTERNAL_IP:?TRAEFIK_EXTERNAL_IP is required}
      - HOME_WAN_IP=${HOME_WAN_IP:?HOME_WAN_IP is required}
      - TZ=${TZ:-America/New_York}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
        - CMD
        - traefik
        - healthcheck
        - --ping
      timeout: 10s
    networks:
      - external
      - internal
    ports:
      - 80:80
      - 443:443
      - ${INTERNAL_IP:?INTERNAL_IP is required}:8443:8443
      - ${INTERNAL_IP:?INTERNAL_IP is required}:8080:8080
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/traefik/certs:/etc/traefik/certs
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/traefik/data/dynamic:/etc/traefik/dynamic:ro
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/traefik/logs:/var/log/traefik
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/traefik/data/traefik.yaml:/etc/traefik/traefik.yaml:ro
