server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions/positions.yaml

clients:
  - url: http://127.0.0.1:3100/loki/api/v1/push

scrape_configs:
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: containerlogs
          host: mothership
          __path__: /var/lib/docker/containers/*/*log

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs:
      - json:
          expressions:
            tag:
          source: attrs
      - regex:
          expression: (?P<container_name>(?:[^|]*))\|
          source: tag
      - timestamp:
          format: RFC3339Nano
          source: time
      - labels:
          stream:
          container_name:
      - output:
          source: output

  # ── system logs (syslog receiver) ────────────────────────────────
  # Mothership (YunoHost) uses systemd journal; rsyslog forwards to
  # promtail's syslog listener. Configure rsyslog with:
  #   *.* @@127.0.0.1:1514;RSYSLOG_SyslogProtocol23Format
  - job_name: syslog
    syslog:
      listen_address: 0.0.0.0:1514
      listen_protocol: tcp
      idle_timeout: 60s
      label_structured_data: yes
      labels:
        job: syslog
        host: mothership

  # ── system logs (files) ─────────────────────────────────────────
  - job_name: auth
    static_configs:
      - targets:
          - localhost
        labels:
          job: auth
          host: mothership
          __path__: /var/log/auth.log

  - job_name: crowdsec
    static_configs:
      - targets:
          - localhost
        labels:
          job: crowdsec
          host: mothership
          __path__: /var/log/crowdsec.log

  - job_name: crowdsec-api
    static_configs:
      - targets:
          - localhost
        labels:
          job: crowdsec-api
          host: mothership
          __path__: /var/log/crowdsec_api.log

  - job_name: crowdsec-bouncer
    static_configs:
      - targets:
          - localhost
        labels:
          job: crowdsec-bouncer
          host: mothership
          __path__: /var/log/crowdsec-firewall-bouncer.log

  - job_name: fail2ban
    static_configs:
      - targets:
          - localhost
        labels:
          job: fail2ban
          host: mothership
          __path__: /var/log/fail2ban.log
