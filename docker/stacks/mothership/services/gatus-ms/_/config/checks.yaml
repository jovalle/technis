---
endpoints:
  - &tcp
    conditions:
      - "[CONNECTED] == true"
    group: 01 · DNS & Transport
    interval: 30s
    name: Local DNS
    url: tcp://technitium:53

  - <<: *tcp
    name: Primary DNS
    url: tcp://100.100.1.2:53

  - <<: *tcp
    name: Nexus DNS
    url: tcp://100.100.1.3:53

  - <<: *tcp
    conditions:
      - "[CONNECTED] == true"
      - "[RESPONSE_TIME] < 1000"
    name: Tailnet Peer · Stargate
    url: icmp://100.100.1.2

  - <<: *tcp
    conditions:
      - "[CONNECTED] == true"
      - "[RESPONSE_TIME] < 1000"
    name: Tailnet Peer · Nexus
    url: icmp://100.100.1.3

  - conditions:
      - "[STATUS] == 200"
    group: 02 · Ingress & Tunnels
    interval: 30s
    name: Traefik
    url: http://traefik/ping

  - conditions:
      - "[STATUS] == 200"
    group: 02 · Ingress & Tunnels
    interval: 30s
    name: Authelia
    url: http://authelia:9091/api/health

  - <<: *tcp
    group: 02 · Ingress & Tunnels
    name: Pangolin API
    url: tcp://pangolin:3001

  - conditions:
      - "[STATUS] == 200"
    group: 02 · Ingress & Tunnels
    interval: 30s
    name: Cloudflare Tunnel · Primary
    url: http://cloudflared-1:60123/ready

  - conditions:
      - "[STATUS] == 200"
    group: 02 · Ingress & Tunnels
    interval: 30s
    name: Cloudflare Tunnel · Secondary
    url: http://cloudflared-2:60123/ready

  - conditions:
      - "[STATUS] == 200"
      - "[BODY] == OK"
    group: 03 · Runtime Control
    interval: 30s
    name: Docker API
    url: http://docker-socket-proxy:2375/_ping

  - <<: *tcp
    group: 03 · Runtime Control
    name: Valkey
    url: tcp://valkey:6379

  - conditions:
      - "[STATUS] == 200"
    group: 04 · Logs & Telemetry
    interval: 30s
    name: Loki
    url: http://loki:3100/ready

  - <<: *tcp
    group: 04 · Logs & Telemetry
    name: Beszel Agent
    url: tcp://100.100.1.1:45876

  - conditions:
      - "[STATUS] == 200"
    group: 05 · Status Services
    interval: 30s
    name: Public Status
    url: http://gatus:8080/

  - conditions:
      - "[STATUS] == 200"
    group: 05 · Status Services
    interval: 30s
    name: Atuin
    url: http://atuin:8888/healthz

  - conditions:
      - "[STATUS] == 200"
      - "[BODY].State.Health.Status == healthy"
    group: 06 · Search
    interval: 30s
    name: searxng
    ui:
      hide-url: true
    url: http://docker-socket-proxy:2375/containers/searxng/json
