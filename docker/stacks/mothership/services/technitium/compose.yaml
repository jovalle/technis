services:
  technitium:
    depends_on:
      tailscale:
        condition: service_healthy
        required: true
    environment:
      - DNS_SERVER_DOMAIN=ms.dns.techn.is
      - DNS_SERVER_WEB_SERVICE_LOCAL_ADDRESSES=100.100.1.1
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 1m0s
      test:
        - CMD-SHELL
        - bash -lc 'echo > /dev/tcp/100.100.1.1/5380' || exit 1
      timeout: 10s
    labels:
      - traefik.enable=false
    network_mode: host
