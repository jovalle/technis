# Probe from outside the home network to detect host and ingress outages too.
jobs:
  - name: website
    url: https://www.techn.is
    update_every: 30
    timeout: 10
    not_follow_redirects: true
    status_accepted: [200]
  - name: media
    url: https://plex.direct.techn.is:443
    update_every: 30
    timeout: 10
    not_follow_redirects: true
    status_accepted: [401]
  - name: photos
    url: https://photos.techn.is/api/server/ping
    update_every: 30
    timeout: 10
    not_follow_redirects: true
    status_accepted: [200]
