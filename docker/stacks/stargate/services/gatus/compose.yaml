services:
  gatus:
    labels:
      - traefik.enable=true
      # Public status.techn.is reaches gatus through the Cloudflare tunnel, not Traefik.
      - traefik.http.routers.gatus.rule=Host(`gatus.techn.is`)
      - traefik.http.routers.gatus.service=gatus
      - traefik.http.services.gatus.loadbalancer.server.port=8080
