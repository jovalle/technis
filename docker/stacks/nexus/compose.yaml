name: nexus

networks:
  coolify:
    external: true
    name: coolify
  default:
    driver: bridge
    enable_ipv6: false
    ipam:
      config:
        - gateway: 172.30.53.1
          subnet: 172.30.53.0/24
    name: nexus_default
