services:
  technitium:
    depends_on:
      tailscale:
        condition: service_healthy
        required: true
    environment:
      - DNS_SERVER_DOMAIN=nx.dns.techn.is
      - DNS_SERVER_WEB_SERVICE_LOCAL_ADDRESSES=192.168.1.3,100.100.1.3
      - DNS_SERVER_WEB_SERVICE_REVERSE_PROXY_ADDRESSES=172.16.0.0/12
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 1m0s
      test:
        - CMD-SHELL
        - bash -lc 'echo > /dev/tcp/100.100.1.3/5380' || exit 1
      timeout: 10s
    labels:
      - traefik.enable=false
    network_mode: host
