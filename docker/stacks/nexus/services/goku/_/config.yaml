    destination: https://en.wikipedia.org/w/index.php?title=Special:Search&fulltext=1&search={topic}
  - alias: w/{topic}
    destination: https://en.wikipedia.org/w/index.php?title=Special:Search&fulltext=1&search={topic}
  - alias: yt/{query}
    destination: https://www.youtube.com/results?search_query={query}
  - alias: ddg/{query}
    destination: https://duckduckgo.com/?q={query}
  - alias: gg/{query}
    destination: https://www.google.com/search?q={query}
  - alias: maps/{query}
    destination: https://www.google.com/maps/search/{query}
  - alias: imdb/{query}
    destination: https://www.imdb.com/find?q={query}
  - alias: npm/{name}
    destination: https://www.npmjs.com/package/{name}
