    destination: https://www.reddit.com/search/?q={query}
  - alias: t/{user}
    destination: https://x.com/{user}
  - alias: "{query}"
    destination: https://{query}.techn.is
    enabled: true
  - alias: "kube/{query}"
    destination: https://kubesearch.dev/#{query}
  - alias: "k8s/{query}"
    destination: https://kubernetes.io/search/?q={query}
