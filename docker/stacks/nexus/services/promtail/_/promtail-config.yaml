server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: containerlogs
          host: nexus
          __path__: /var/lib/docker/containers/*/*log

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs:
      - json:
          expressions:
            tag:
          source: attrs
      - regex:
          expression: (?P<container_name>(?:[^|]*))\|
          source: tag
      - timestamp:
          format: RFC3339Nano
          source: time
      - labels:
          stream:
          container_name:
      - output:
          source: output

  # ── system logs ──────────────────────────────────────────────
  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          host: nexus
          __path__: /var/log/syslog

  - job_name: auth
    static_configs:
      - targets:
          - localhost
        labels:
          job: auth
          host: nexus
          __path__: /var/log/auth.log

  - job_name: kernel
    static_configs:
      - targets:
          - localhost
        labels:
          job: kernel
          host: nexus
          __path__: /var/log/kern.log

  - job_name: daemon
    static_configs:
      - targets:
          - localhost
        labels:
          job: daemon
          host: nexus
          __path__: /var/log/daemon.log

  - job_name: messages
    static_configs:
      - targets:
          - localhost
        labels:
          job: messages
          host: nexus
          __path__: /var/log/messages

  - job_name: cron
    static_configs:
      - targets:
          - localhost
        labels:
          job: cron
          host: nexus
          __path__: /var/log/cron.log

  # ── truenas logs ────────────────────────────────────────────
  - job_name: truenas-middleware
    static_configs:
      - targets:
          - localhost
        labels:
          job: truenas-middleware
          host: nexus
          __path__: /var/log/middlewared.log

  - job_name: truenas-error
    static_configs:
      - targets:
          - localhost
        labels:
          job: truenas-error
          host: nexus
          __path__: /var/log/error

  - job_name: truenas-samba
    static_configs:
      - targets:
          - localhost
        labels:
          job: truenas-samba
          host: nexus
          __path__: /var/log/samba4/*.log
