services:
  authelia:
    depends_on:
      authelia-postgres:
        condition: service_healthy
        required: true
      authelia-redis:
        condition: service_healthy
        required: true
    networks:
      - default
    ports:
      - host_ip: 192.168.1.3
        published: "9091"
        target: 9091
      - host_ip: 100.100.1.3
        published: "9091"
        target: 9091

  authelia-postgres:
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    container_name: authelia-postgres
    depends_on:
      tailscale:
        condition: service_healthy
        required: true
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 1024M
        reservations:
          cpus: 0.1
          memory: 128M
    environment:
      - POSTGRES_DB=authelia
      - POSTGRES_PASSWORD=${AUTHELIA_STORAGE_ENCRYPTION_KEY:?AUTHELIA_STORAGE_ENCRYPTION_KEY is required}
      - POSTGRES_USER=authelia
      - TZ=${TZ:-America/New_York}
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 30s
      test:
        - CMD-SHELL
        - pg_isready -U authelia -d authelia
      timeout: 5s
    hostname: authelia-postgres
    image: postgres:17-alpine
    labels:
      - gatus.group=data
      - gatus.priority=P2
      - traefik.enable=false
    networks:
      - default
    ports:
      - host_ip: 100.100.1.3
        published: "5433"
        target: 5432
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/authelia/postgres:/var/lib/postgresql/data

  authelia-redis:
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    command:
      - valkey-server
      - --requirepass
      - ${AUTHELIA_SESSION_SECRET:?AUTHELIA_SESSION_SECRET is required}
      - --save
      - "60"
      - "1"
      - --loglevel
      - warning
    container_name: authelia-redis
    depends_on:
      tailscale:
        condition: service_healthy
        required: true
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 256M
        reservations:
          cpus: 0.05
          memory: 32M
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 10s
      test:
        - CMD-SHELL
        - valkey-cli -a "$$AUTHELIA_SESSION_SECRET" ping | grep -q PONG
      timeout: 5s
    environment:
      - AUTHELIA_SESSION_SECRET=${AUTHELIA_SESSION_SECRET:?AUTHELIA_SESSION_SECRET is required}
    hostname: authelia-redis
    image: ghcr.io/valkey-io/valkey:9-alpine
    labels:
      - gatus.group=data
      - gatus.priority=P2
      - traefik.enable=false
    networks:
      - default
    ports:
      - host_ip: 100.100.1.3
        published: "6380"
        target: 6379
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - ${STACK_DATA_ROOT:?STACK_DATA_ROOT is required}/authelia/redis:/data
