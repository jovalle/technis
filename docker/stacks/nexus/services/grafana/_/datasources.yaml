---
apiVersion: 1
datasources:
  - access: proxy
    editable: true
    isDefault: true
    jsonData:
      httpMethod: POST
      manageAlerts: false
    name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
  - access: proxy
    editable: true
    jsonData:
      maxLines: 1000
    name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1
