---
ci:
  autofix_commit_msg: "chore(pre-commit): auto fixes from pre-commit hooks\n\n[skip ci]\n"
  autofix_prs: true
  autoupdate_commit_msg: "chore(pre-commit): autoupdate hook versions"
  autoupdate_schedule: weekly
repos:
  - hooks:
      - args:
          - --markdown-linebreak-ext=md
        id: trailing-whitespace
      - id: end-of-file-fixer
      - args:
          - --allow-multiple-documents
          - --unsafe
        id: check-yaml
      - args:
          - --maxkb=1024
        id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict
      - exclude: ^LICENSE$
        id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: mixed-line-ending
      - id: detect-private-key
    repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
  - hooks:
      - id: gitleaks
    repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
  - hooks:
      - args:
          - --severity=warning
          - --shell=bash
        exclude: ^(docs/|web/|archive/)
        id: shellcheck
    repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
  - hooks:
      - args:
          - -i
          - "2"
          - -ci
          - -w
        exclude: ^(docs/|web/|archive/)
        id: shfmt
    repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-2
  - hooks:
      - args:
          - --config-file=.yamllint.yaml
        exclude: ^(archive/|docs/)
        id: yamllint
    repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
  - hooks:
      - args:
          - --config=.markdownlint.yaml
        exclude: ^(archive/|CHANGELOG)
        id: markdownlint
    repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
  - hooks:
      - exclude: ^(archive/|package-lock\.json)
        args:
          - --no-error-on-unmatched-pattern
        id: prettier
        types_or:
          - json
          - markdown
          - yaml
    repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
  - hooks:
      - args:
          - --strict
        id: conventional-pre-commit
        stages:
          - commit-msg
    repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
