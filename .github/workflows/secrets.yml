name: Secrets

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.25.4'
          cache: false
      - name: Install Gitleaks
        run: |
          version=$(python3 .github/scripts/gitleaks-version.py)
          GOBIN="${RUNNER_TEMP}" go install "github.com/zricethezav/gitleaks/v8@v${version}"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Verify scanner
        run: bash .github/scripts/test-scan-secrets.sh
      - name: Scan incoming commits
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          SCAN_HEAD: ${{ github.sha }}
        run: bash .github/scripts/scan-secrets.sh
